<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1f4e79" />
  <title>Görev Sırası</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Görev Sırası</h1>
      <p id="conn" class="conn"></p>
    </div>
    <button id="me-btn" class="me" type="button"></button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="give" aria-selected="true">Görev ver</button>
    <button role="tab" data-tab="history">Geçmiş</button>
    <button role="tab" data-tab="team">Ekip</button>
    <button role="tab" data-tab="settings">Ayarlar</button>
  </nav>

  <main id="view" tabindex="-1"><p class="loading">Yükleniyor…</p></main>

  <dialog id="dlg"><form id="dlg-form" method="dialog"></form></dialog>

  <dialog id="confirm-dlg" class="confirm">
    <form method="dialog">
      <p id="confirm-msg"></p>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button value="no" class="btn">Vazgeç</button>
        <button value="yes" class="btn primary" id="confirm-yes">Evet</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
