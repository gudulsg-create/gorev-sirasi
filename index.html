<!DOCTYPE html>
<html lang="tr" data-theme="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2357" />
  <title>Görev Sırası</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Görev Sırası" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script>
    // Tema seçimini sayfa çizilmeden uygula (yanıp sönmesin).
    try { document.documentElement.dataset.theme = localStorage.getItem('gorev-sirasi:theme') || 'sl'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Görev Sırası</h1>
      <p id="conn" class="conn"></p>
    </div>
    <button id="me-btn" class="me" type="button"></button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="give" aria-selected="true">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="tab-label">Görev ver</span>
    </button>
    <button role="tab" data-tab="mine">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span class="tab-count" id="mine-count" hidden></span></span>
      <span class="tab-label">Görevlerim</span>
    </button>
    <button role="tab" data-tab="history">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      <span class="tab-label">Geçmiş</span>
    </button>
    <button role="tab" data-tab="team">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8M17.5 14.3c1.6.6 2.7 2.2 3 4.7"/></svg></span>
      <span class="tab-label">Ekip</span>
    </button>
    <button role="tab" data-tab="settings">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></span>
      <span class="tab-label">Ayarlar</span>
    </button>
  </nav>

  <main id="view" tabindex="-1"><p class="loading">Yükleniyor…</p></main>

  <dialog id="dlg"><form id="dlg-form" method="dialog"></form></dialog>

  <dialog id="confirm-dlg" class="confirm">
    <form method="dialog">
      <p id="confirm-msg"></p>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button value="no" class="btn">Vazgeç</button>
        <button value="yes" class="btn primary" id="confirm-yes">Evet</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
